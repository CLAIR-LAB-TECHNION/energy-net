[metadata]
name = energy-net
version = 0.1.0
author = Sarah Keren
author_email = sarahk@technion.ac.il
description = A package for smart grid simulation.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/CLAIR-LAB-TECHNION/energy-net
license = MIT
license_files = LICENSE
keywords = smart-grid
classifiers =
    Programming Language :: Python
    Programming Language :: Python :: 3

[options]
packages = find:
python_requires = >=3.10
install_requires =
    numpy
    scipy
    pandas
    gymnasium
    pyyaml
    scikit-learn

[options.extras_require]
rl =
    stable-baselines3
    tensorboard
    matplotlib
    torch
    sb3_contrib
test =
    stable-baselines3
    tensorboard
    matplotlib
    torch
    sb3_contrib
    pytest
excel =
    openpyxl
multi =
    pettingzoo